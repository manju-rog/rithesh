<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Complete - TRIO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow-x: hidden;
            background: #0a0e1a;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: none;
            padding: 40px 20px;
        }

        /* Custom Cursor */
        .cursor {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(16, 185, 129, 0.8);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.15s ease;
            mix-blend-mode: difference;
        }

        .cursor-follower {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            transition: transform 0.3s ease;
            mix-blend-mode: difference;
        }

        /* Background */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .bg-gradient {
            position: absolute;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(circle at 30% 50%, rgba(16, 185, 129, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 70% 70%, rgba(34, 211, 238, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 30%, rgba(59, 130, 246, 0.15) 0%, transparent 50%);
            animation: celebrationGradient 15s ease infinite;
        }

        @keyframes celebrationGradient {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
            33% { transform: translate(-5%, 5%) rotate(120deg) scale(1.1); }
            66% { transform: translate(5%, -5%) rotate(240deg) scale(0.9); }
        }

        /* Confetti */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #10b981;
            position: absolute;
            animation: confettiFall 3s ease-out forwards;
            z-index: 10;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Main Container */
        .completion-container {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 800px;
            animation: containerFadeIn 1s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes containerFadeIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Success Icon */
        .success-icon {
            width: 140px;
            height: 140px;
            margin: 0 auto 40px;
            position: relative;
            animation: iconBounce 1s cubic-bezier(0.23, 1, 0.32, 1) 0.2s backwards;
        }

        @keyframes iconBounce {
            0% {
                transform: scale(0) rotate(-180deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.2) rotate(10deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .success-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(34, 211, 238, 0.2));
            backdrop-filter: blur(10px);
            border: 3px solid rgba(16, 185, 129, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 72px;
            box-shadow:
                0 0 40px rgba(16, 185, 129, 0.4),
                inset 0 0 20px rgba(16, 185, 129, 0.2);
            animation: iconGlow 2s ease-in-out infinite;
        }

        @keyframes iconGlow {
            0%, 100% { box-shadow: 0 0 40px rgba(16, 185, 129, 0.4), inset 0 0 20px rgba(16, 185, 129, 0.2); }
            50% { box-shadow: 0 0 60px rgba(16, 185, 129, 0.6), inset 0 0 30px rgba(16, 185, 129, 0.3); }
        }

        /* Title */
        .completion-title {
            font-size: 64px;
            font-weight: 900;
            margin-bottom: 20px;
            animation: titleReveal 0.8s cubic-bezier(0.23, 1, 0.32, 1) 0.4s backwards;
        }

        .title-amazing {
            background: linear-gradient(135deg, #10b981, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .title-work {
            color: rgba(255, 255, 255, 0.9);
        }

        @keyframes titleReveal {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .completion-subtitle {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 60px;
            font-weight: 400;
            animation: titleReveal 0.8s cubic-bezier(0.23, 1, 0.32, 1) 0.6s backwards;
        }

        /* Session Summary Card */
        .summary-card {
            background: rgba(15, 25, 40, 0.6);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(34, 211, 238, 0.3);
            border-radius: 32px;
            padding: 48px;
            margin-bottom: 48px;
            animation: cardSlideIn 0.8s cubic-bezier(0.23, 1, 0.32, 1) 0.8s backwards;
            position: relative;
            overflow: hidden;
        }

        @keyframes cardSlideIn {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .summary-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .summary-header {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 32px;
        }

        .activity-display {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #06b6d4, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 40px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 32px;
            margin-bottom: 32px;
        }

        .stat-box {
            background: rgba(6, 182, 212, 0.1);
            padding: 24px;
            border-radius: 20px;
            border: 1px solid rgba(34, 211, 238, 0.2);
            transition: all 0.4s ease;
        }

        .stat-box:hover {
            transform: translateY(-4px);
            background: rgba(6, 182, 212, 0.15);
            border-color: rgba(34, 211, 238, 0.4);
            box-shadow: 0 10px 30px rgba(6, 182, 212, 0.3);
        }

        .stat-value {
            font-size: 48px;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
            font-variant-numeric: tabular-nums;
        }

        .stat-label {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
        }

        .total-duration {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.7);
            padding: 20px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 16px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .duration-highlight {
            font-size: 28px;
            font-weight: 700;
            color: #10b981;
            margin-left: 12px;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 24px;
            justify-content: center;
            animation: buttonsAppear 0.8s cubic-bezier(0.23, 1, 0.32, 1) 1s backwards;
        }

        @keyframes buttonsAppear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn {
            padding: 20px 48px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 10px 40px rgba(16, 185, 129, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 60px rgba(16, 185, 129, 0.6);
        }

        .btn-secondary {
            background: rgba(34, 211, 238, 0.2);
            color: white;
            border: 2px solid rgba(34, 211, 238, 0.5);
        }

        .btn-secondary:hover {
            background: rgba(34, 211, 238, 0.3);
            border-color: rgba(34, 211, 238, 0.7);
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(34, 211, 238, 0.3);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:active {
            transform: translateY(-2px);
        }

        /* Floating Celebration Particles */
        .celebration-particle {
            position: fixed;
            width: 8px;
            height: 8px;
            background: linear-gradient(135deg, #10b981, #22d3ee);
            border-radius: 50%;
            pointer-events: none;
            animation: celebrationFloat 4s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
        }

        @keyframes celebrationFloat {
            0%, 100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.6;
            }
            50% {
                transform: translate(var(--x), var(--y)) scale(1.5);
                opacity: 1;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .completion-title {
                font-size: 48px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .action-buttons {
                flex-direction: column;
                width: 100%;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .summary-card {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>
    <!-- Custom Cursor -->
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <!-- Background -->
    <div class="bg-container">
        <div class="bg-gradient"></div>
    </div>

    <!-- Celebration Particles -->
    <div id="celebrationParticles"></div>

    <!-- Main Content -->
    <div class="completion-container">
        <div class="success-icon">
            <div class="success-circle">
                ✓
            </div>
        </div>

        <h1 class="completion-title">
            <span class="title-amazing">Amazing</span> <span class="title-work">Work!</span>
        </h1>
        <p class="completion-subtitle">Your session has been completed successfully</p>

        <div class="summary-card">
            <div class="summary-header">Session Summary</div>
            <div class="activity-display" id="activityName">Loading...</div>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-value" id="hoursDisplay">0</div>
                    <div class="stat-label">Hours</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="minutesDisplay">0</div>
                    <div class="stat-label">Minutes</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="secondsDisplay">0</div>
                    <div class="stat-label">Seconds</div>
                </div>
            </div>

            <div class="total-duration">
                Total Duration: <span class="duration-highlight" id="totalDuration">00:00:00</span>
            </div>
        </div>

        <div class="action-buttons">
            <a href="index.html" class="btn btn-primary">
                <span>Start New Session</span>
                <span>→</span>
            </a>
            <a href="welcome-checkin.html" class="btn btn-secondary">
                <span>Back to Home</span>
            </a>
        </div>
    </div>

    <script>
        // Custom Cursor
        const cursor = document.querySelector('.cursor');
        const follower = document.querySelector('.cursor-follower');

        let mouseX = 0, mouseY = 0;
        let cursorX = 0, cursorY = 0;
        let followerX = 0, followerY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animateCursor() {
            cursorX += (mouseX - cursorX) * 0.3;
            cursorY += (mouseY - cursorY) * 0.3;

            followerX += (mouseX - followerX) * 0.1;
            followerY += (mouseY - followerY) * 0.1;

            cursor.style.transform = `translate(${cursorX}px, ${cursorY}px)`;
            follower.style.transform = `translate(${followerX}px, ${followerY}px)`;

            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // Cursor effects on buttons
        const buttons = document.querySelectorAll('.btn');
        buttons.forEach(btn => {
            btn.addEventListener('mouseenter', () => {
                cursor.style.transform = `translate(${cursorX}px, ${cursorY}px) scale(1.5)`;
                follower.style.transform = `translate(${followerX}px, ${followerY}px) scale(1.5)`;
            });
            btn.addEventListener('mouseleave', () => {
                cursor.style.transform = `translate(${cursorX}px, ${cursorY}px) scale(1)`;
                follower.style.transform = `translate(${followerX}px, ${followerY}px) scale(1)`;
            });
        });

        // Confetti Explosion
        function createConfetti() {
            const colors = ['#10b981', '#22d3ee', '#06b6d4', '#3b82f6', '#fb923c'];

            for (let i = 0; i < 150; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = Math.random() * 0.5 + 's';
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';

                    // Random shapes
                    if (Math.random() > 0.5) {
                        confetti.style.borderRadius = '50%';
                    } else if (Math.random() > 0.5) {
                        confetti.style.width = '3px';
                        confetti.style.height = '15px';
                    }

                    document.body.appendChild(confetti);

                    setTimeout(() => confetti.remove(), 3000);
                }, i * 15);
            }
        }

        // Celebration Particles
        const celebrationContainer = document.getElementById('celebrationParticles');
        for (let i = 0; i < 20; i++) {
            const particle = document.createElement('div');
            particle.className = 'celebration-particle';

            const angle = (i / 20) * Math.PI * 2;
            const distance = 100 + Math.random() * 200;
            const x = Math.cos(angle) * distance;
            const y = Math.sin(angle) * distance;

            particle.style.setProperty('--x', `${x}px`);
            particle.style.setProperty('--y', `${y}px`);
            particle.style.left = '50%';
            particle.style.top = '50%';
            particle.style.animationDelay = `${Math.random() * 2}s`;
            particle.style.animationDuration = `${4 + Math.random() * 2}s`;

            celebrationContainer.appendChild(particle);
        }

        // Load session data from localStorage
        const lastActivity = localStorage.getItem('currentActivity') || 'Activity';
        const checkInTime = localStorage.getItem('checkInTime');
        const checkOutTime = Date.now();

        if (checkInTime) {
            const elapsed = checkOutTime - parseInt(checkInTime);
            const hours = Math.floor(elapsed / 3600000);
            const minutes = Math.floor((elapsed % 3600000) / 60000);
            const seconds = Math.floor((elapsed % 60000) / 1000);

            document.getElementById('activityName').textContent = lastActivity.toUpperCase();
            document.getElementById('hoursDisplay').textContent = hours;
            document.getElementById('minutesDisplay').textContent = minutes;
            document.getElementById('secondsDisplay').textContent = seconds;
            document.getElementById('totalDuration').textContent =
                `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

            // Clear check-in time
            localStorage.removeItem('checkInTime');
        }

        // Trigger confetti on load
        setTimeout(() => {
            createConfetti();
        }, 500);

        // Additional confetti bursts
        setTimeout(() => createConfetti(), 2000);
        setTimeout(() => createConfetti(), 3500);
    </script>
</body>
</html>
