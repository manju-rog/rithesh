<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Active - TRIO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
            background: #0a0e1a;
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: none;
        }

        /* Custom Cursor */
        .cursor {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(34, 211, 238, 0.8);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.15s ease;
            mix-blend-mode: difference;
        }

        .cursor-follower {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(34, 211, 238, 0.3);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            transition: transform 0.3s ease;
            mix-blend-mode: difference;
        }

        /* Background */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .bg-gradient {
            position: absolute;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(circle at 20% 50%, rgba(6, 182, 212, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(34, 211, 238, 0.15) 0%, transparent 50%);
            animation: gradientShift 25s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(-5%, 5%) rotate(120deg); }
            66% { transform: translate(5%, -5%) rotate(240deg); }
        }

        /* Energy Grid */
        .energy-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(6, 182, 212, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6, 182, 212, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridFlow 20s linear infinite;
        }

        @keyframes gridFlow {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 900px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 60px;
        }

        /* Activity Header */
        .activity-header {
            text-align: center;
            animation: slideDown 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .activity-label {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(34, 211, 238, 0.6);
            margin-bottom: 16px;
        }

        .activity-name {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #06b6d4, #3b82f6, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s ease infinite;
            background-size: 200% 200%;
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Timer Circle Container */
        .timer-circle-container {
            position: relative;
            width: 450px;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: scaleIn 1s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.5) rotate(-180deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        /* Rotating Glow Ring */
        .glow-ring {
            position: absolute;
            width: 480px;
            height: 480px;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                rgba(6, 182, 212, 0.3) 90deg,
                rgba(59, 130, 246, 0.3) 180deg,
                rgba(34, 211, 238, 0.3) 270deg,
                transparent 360deg
            );
            animation: rotate 4s linear infinite;
            filter: blur(20px);
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Progress Circle SVG */
        .progress-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .progress-ring-bg {
            fill: none;
            stroke: rgba(6, 182, 212, 0.1);
            stroke-width: 3;
        }

        .progress-ring-circle {
            fill: none;
            stroke: url(#progressGradient);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-dasharray: 1414;
            stroke-dashoffset: 1414;
            animation: progressPulse 2s ease-in-out infinite;
            filter: drop-shadow(0 0 10px rgba(6, 182, 212, 0.6));
        }

        @keyframes progressPulse {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(6, 182, 212, 0.6)); }
            50% { filter: drop-shadow(0 0 20px rgba(6, 182, 212, 0.9)); }
        }

        /* Energy Particles orbiting the timer */
        .energy-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .energy-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, rgba(34, 211, 238, 1) 0%, transparent 70%);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.8);
            animation: orbit 6s linear infinite;
        }

        .energy-particle:nth-child(1) { animation-delay: 0s; }
        .energy-particle:nth-child(2) { animation-delay: -1s; }
        .energy-particle:nth-child(3) { animation-delay: -2s; }
        .energy-particle:nth-child(4) { animation-delay: -3s; }
        .energy-particle:nth-child(5) { animation-delay: -4s; }
        .energy-particle:nth-child(6) { animation-delay: -5s; }

        @keyframes orbit {
            from {
                transform: rotate(0deg) translateX(240px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            to {
                transform: rotate(360deg) translateX(240px) rotate(-360deg);
                opacity: 0;
            }
        }

        /* Center Timer Display */
        .timer-display {
            position: relative;
            z-index: 5;
            text-align: center;
            background: radial-gradient(circle, rgba(10, 14, 26, 0.9) 0%, rgba(10, 14, 26, 0.7) 100%);
            backdrop-filter: blur(20px);
            border-radius: 50%;
            width: 350px;
            height: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(6, 182, 212, 0.2);
            box-shadow:
                inset 0 0 60px rgba(6, 182, 212, 0.1),
                0 10px 60px rgba(6, 182, 212, 0.2);
        }

        .time-elapsed-label {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(34, 211, 238, 0.6);
            margin-bottom: 20px;
        }

        .time {
            font-size: 72px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: #fff;
            letter-spacing: 4px;
            text-shadow:
                0 0 20px rgba(6, 182, 212, 0.5),
                0 0 40px rgba(6, 182, 212, 0.3);
            animation: timeGlow 2s ease-in-out infinite;
        }

        @keyframes timeGlow {
            0%, 100% {
                text-shadow:
                    0 0 20px rgba(6, 182, 212, 0.5),
                    0 0 40px rgba(6, 182, 212, 0.3);
            }
            50% {
                text-shadow:
                    0 0 30px rgba(6, 182, 212, 0.7),
                    0 0 60px rgba(6, 182, 212, 0.5);
            }
        }

        .current-time {
            font-size: 16px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 20px;
            font-variant-numeric: tabular-nums;
        }

        /* Stats Panel */
        .stats-panel {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            width: 100%;
            max-width: 700px;
            animation: slideUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.6s both;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stat-card {
            background: rgba(15, 15, 25, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(6, 182, 212, 0.2);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(6, 182, 212, 0.1), transparent);
            transition: left 0.6s ease;
        }

        .stat-card:hover {
            transform: translateY(-10px);
            border-color: rgba(6, 182, 212, 0.5);
            box-shadow: 0 20px 60px rgba(6, 182, 212, 0.3);
        }

        .stat-card:hover::before {
            left: 100%;
        }

        .stat-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(34, 211, 238, 0.6);
            margin-bottom: 12px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 800;
            color: #fff;
            font-variant-numeric: tabular-nums;
        }

        /* Checkout Button */
        .checkout-button {
            margin-top: 20px;
            padding: 20px 60px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: white;
            background: linear-gradient(135deg, #06b6d4, #0284c7);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
            box-shadow:
                0 10px 40px rgba(6, 182, 212, 0.4),
                inset 0 -2px 10px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.9s both;
        }

        .checkout-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }

        .checkout-button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow:
                0 20px 60px rgba(6, 182, 212, 0.6),
                inset 0 -2px 10px rgba(0, 0, 0, 0.2);
        }

        .checkout-button:hover::before {
            width: 300px;
            height: 300px;
        }

        .checkout-button:active {
            transform: translateY(-2px) scale(1.02);
        }

        .checkout-button span {
            position: relative;
            z-index: 1;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
                gap: 40px;
            }

            .activity-name {
                font-size: 32px;
            }

            .timer-circle-container {
                width: 320px;
                height: 320px;
            }

            .glow-ring {
                width: 350px;
                height: 350px;
            }

            .timer-display {
                width: 250px;
                height: 250px;
            }

            .time {
                font-size: 48px;
            }

            .stats-panel {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .checkout-button {
                padding: 16px 40px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Custom Cursor -->
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <!-- Background -->
    <div class="bg-container">
        <div class="bg-gradient"></div>
        <div class="energy-grid"></div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Activity Header -->
        <div class="activity-header">
            <div class="activity-label">Currently Tracking</div>
            <div class="activity-name" id="activityName">Study</div>
        </div>

        <!-- Timer Circle -->
        <div class="timer-circle-container">
            <!-- Rotating Glow -->
            <div class="glow-ring"></div>

            <!-- Progress Ring SVG -->
            <svg class="progress-ring" viewBox="0 0 450 450">
                <defs>
                    <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:1" />
                    </linearGradient>
                </defs>
                <circle class="progress-ring-bg" cx="225" cy="225" r="220"/>
                <circle class="progress-ring-circle" cx="225" cy="225" r="220" id="progressCircle"/>
            </svg>

            <!-- Energy Particles -->
            <div class="energy-particles">
                <div class="energy-particle"></div>
                <div class="energy-particle"></div>
                <div class="energy-particle"></div>
                <div class="energy-particle"></div>
                <div class="energy-particle"></div>
                <div class="energy-particle"></div>
            </div>

            <!-- Center Timer Display -->
            <div class="timer-display">
                <div class="time-elapsed-label">Time Elapsed</div>
                <div class="time" id="timerDisplay">00:00:00</div>
                <div class="current-time" id="currentTime">00:00:00</div>
            </div>
        </div>

        <!-- Stats Panel -->
        <div class="stats-panel">
            <div class="stat-card">
                <div class="stat-label">Session Start</div>
                <div class="stat-value" id="startTime">--:--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Focus Score</div>
                <div class="stat-value" id="focusScore">98%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Productivity</div>
                <div class="stat-value" id="productivity">HIGH</div>
            </div>
        </div>

        <!-- Checkout Button -->
        <button class="checkout-button" id="checkoutBtn">
            <span>Complete Session</span>
        </button>
    </div>

    <script>
        // Custom Cursor
        const cursor = document.querySelector('.cursor');
        const cursorFollower = document.querySelector('.cursor-follower');

        let cursorX = 0, cursorY = 0;
        let followerX = 0, followerY = 0;

        document.addEventListener('mousemove', (e) => {
            cursorX = e.clientX;
            cursorY = e.clientY;
        });

        function animateCursor() {
            cursor.style.transform = `translate(${cursorX - 10}px, ${cursorY - 10}px)`;

            followerX += (cursorX - followerX) * 0.1;
            followerY += (cursorY - followerY) * 0.1;
            cursorFollower.style.transform = `translate(${followerX - 20}px, ${followerY - 20}px)`;

            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // Hover effects for interactive elements
        const interactiveElements = document.querySelectorAll('button, .stat-card');
        interactiveElements.forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursor.style.transform = `translate(${cursorX - 10}px, ${cursorY - 10}px) scale(1.5)`;
            });
            el.addEventListener('mouseleave', () => {
                cursor.style.transform = `translate(${cursorX - 10}px, ${cursorY - 10}px) scale(1)`;
            });
        });

        // Timer Logic
        let startTime = Date.now();
        let elapsedSeconds = 0;
        const timerDisplay = document.getElementById('timerDisplay');
        const currentTimeDisplay = document.getElementById('currentTime');
        const startTimeDisplay = document.getElementById('startTime');
        const progressCircle = document.getElementById('progressCircle');
        const activityNameElement = document.getElementById('activityName');

        // Load session data from localStorage
        const sessionData = JSON.parse(localStorage.getItem('trioSession') || '{}');
        if (sessionData.activity) {
            activityNameElement.textContent = sessionData.activity;
        }
        if (sessionData.startTime) {
            startTime = new Date(sessionData.startTime).getTime();
            const startDate = new Date(sessionData.startTime);
            startTimeDisplay.textContent = startDate.toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            });
        } else {
            // Initialize session if not exists
            const now = new Date();
            startTimeDisplay.textContent = now.toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            });
            localStorage.setItem('trioSession', JSON.stringify({
                activity: activityNameElement.textContent,
                startTime: now.toISOString(),
                userName: sessionData.userName || 'User'
            }));
        }

        function updateTimer() {
            // Calculate elapsed time
            elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);

            const hours = Math.floor(elapsedSeconds / 3600);
            const minutes = Math.floor((elapsedSeconds % 3600) / 60);
            const seconds = elapsedSeconds % 60;

            timerDisplay.textContent =
                `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

            // Update current time
            const now = new Date();
            currentTimeDisplay.textContent = now.toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });

            // Update progress circle (animate based on time, e.g., complete circle every hour)
            const maxSeconds = 3600; // 1 hour
            const progress = (elapsedSeconds % maxSeconds) / maxSeconds;
            const circumference = 2 * Math.PI * 220;
            const offset = circumference - (progress * circumference);
            progressCircle.style.strokeDashoffset = offset;
        }

        // Update timer every second
        setInterval(updateTimer, 1000);
        updateTimer(); // Initial update

        // Simulate focus score updating
        const focusScoreElement = document.getElementById('focusScore');
        setInterval(() => {
            const score = 95 + Math.floor(Math.random() * 5);
            focusScoreElement.textContent = `${score}%`;
        }, 5000);

        // Checkout button
        document.getElementById('checkoutBtn').addEventListener('click', () => {
            // Save session data
            const session = JSON.parse(localStorage.getItem('trioSession') || '{}');
            session.endTime = new Date().toISOString();
            session.duration = elapsedSeconds;
            localStorage.setItem('trioSession', JSON.stringify(session));

            // Redirect to completion page
            window.location.href = 'session-complete.html';
        });
    </script>
</body>
</html>
