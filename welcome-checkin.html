<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to TRIO - Check In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
            background: #0a0e1a;
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: none;
        }

        /* Custom Cursor */
        .cursor {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(34, 211, 238, 0.8);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.15s ease;
            mix-blend-mode: difference;
        }

        .cursor-follower {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(34, 211, 238, 0.3);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            transition: transform 0.3s ease;
            mix-blend-mode: difference;
        }

        /* Background */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .bg-gradient {
            position: absolute;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(circle at 20% 50%, rgba(6, 182, 212, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(251, 146, 60, 0.15) 0%, transparent 50%);
            animation: gradientShift 25s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(-5%, 5%) rotate(120deg); }
            66% { transform: translate(5%, -5%) rotate(240deg); }
        }

        /* Particles */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(34, 211, 238, 0.6);
            border-radius: 50%;
            animation: particleFloat 20s infinite linear;
            opacity: 0;
            box-shadow: 0 0 10px rgba(34, 211, 238, 0.5);
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) translateX(0) scale(0);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: translateY(-100vh) translateX(100px) scale(1.5);
                opacity: 0;
            }
        }

        /* Floating Orbs */
        .floating-orb {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 20s ease-in-out infinite;
        }

        .orb-1 {
            background: radial-gradient(circle, rgba(6, 182, 212, 0.8), transparent);
            top: -20%;
            left: -10%;
            animation-delay: 0s;
        }

        .orb-2 {
            background: radial-gradient(circle, rgba(251, 146, 60, 0.8), transparent);
            bottom: -20%;
            right: -10%;
            animation-delay: -10s;
        }

        .orb-3 {
            background: radial-gradient(circle, rgba(59, 130, 246, 0.8), transparent);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -5s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -50px) scale(1.1); }
            66% { transform: translate(-50px, 50px) scale(0.9); }
        }

        /* Main Content */
        .main-content {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 800px;
            padding: 40px;
        }

        /* Title Animation */
        .welcome-text {
            font-size: 120px;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 40px;
            letter-spacing: -3px;
        }

        .welcome-text span {
            display: inline-block;
            animation: titleReveal 0.8s cubic-bezier(0.23, 1, 0.32, 1) backwards;
        }

        .welcome-text .word-welcome span:nth-child(1) { animation-delay: 0.1s; }
        .welcome-text .word-welcome span:nth-child(2) { animation-delay: 0.15s; }
        .welcome-text .word-welcome span:nth-child(3) { animation-delay: 0.2s; }
        .welcome-text .word-welcome span:nth-child(4) { animation-delay: 0.25s; }
        .welcome-text .word-welcome span:nth-child(5) { animation-delay: 0.3s; }
        .welcome-text .word-welcome span:nth-child(6) { animation-delay: 0.35s; }
        .welcome-text .word-welcome span:nth-child(7) { animation-delay: 0.4s; }

        .word-to {
            color: rgba(255, 255, 255, 0.4);
            font-weight: 500;
            margin: 0 20px;
        }

        .word-to span { animation-delay: 0.5s; }

        .word-trio span:nth-child(1) { animation-delay: 0.6s; }
        .word-trio span:nth-child(2) { animation-delay: 0.65s; }
        .word-trio span:nth-child(3) { animation-delay: 0.7s; }
        .word-trio span:nth-child(4) { animation-delay: 0.75s; }

        .word-trio {
            background: linear-gradient(135deg, #06b6d4, #3b82f6, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            display: inline-block;
        }

        .word-trio::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg, #06b6d4, #3b82f6, #22d3ee);
            border-radius: 4px;
            animation: underlineGrow 0.6s cubic-bezier(0.23, 1, 0.32, 1) 0.8s backwards;
        }

        @keyframes underlineGrow {
            from { transform: scaleX(0); }
            to { transform: scaleX(1); }
        }

        @keyframes titleReveal {
            from {
                opacity: 0;
                transform: translateY(50px) rotateX(-90deg);
            }
            to {
                opacity: 1;
                transform: translateY(0) rotateX(0);
            }
        }

        /* Input Container */
        .input-container {
            margin-top: 80px;
            position: relative;
            animation: fadeInUp 0.8s cubic-bezier(0.23, 1, 0.32, 1) 1s backwards;
        }

        .input-label {
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 20px;
            font-weight: 500;
            animation: fadeIn 1s ease 1.2s backwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .input-wrapper {
            position: relative;
            perspective: 1000px;
        }

        .input-glow {
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, #06b6d4, #3b82f6, #22d3ee, #06b6d4);
            background-size: 300% 300%;
            border-radius: 50px;
            opacity: 0;
            filter: blur(20px);
            transition: opacity 0.4s ease;
            animation: borderGlow 3s ease infinite;
        }

        @keyframes borderGlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .input-wrapper:hover .input-glow,
        .name-input:focus ~ .input-glow {
            opacity: 0.8;
        }

        .name-input {
            width: 100%;
            padding: 28px 40px;
            font-size: 24px;
            font-weight: 400;
            color: white;
            background: rgba(15, 25, 40, 0.6);
            backdrop-filter: blur(20px) saturate(180%);
            border: 2px solid rgba(34, 211, 238, 0.3);
            border-radius: 50px;
            outline: none;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            z-index: 1;
            letter-spacing: 2px;
        }

        .name-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .name-input:focus {
            transform: translateY(-4px);
            border-color: rgba(34, 211, 238, 0.6);
            box-shadow:
                0 20px 60px rgba(6, 182, 212, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* Continue Button */
        .continue-btn {
            margin-top: 60px;
            padding: 24px 80px;
            font-size: 18px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #06b6d4, #0284c7);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 10px 40px rgba(6, 182, 212, 0.4);
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }

        .continue-btn.active {
            animation: buttonAppear 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards;
            pointer-events: auto;
        }

        @keyframes buttonAppear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .continue-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s ease;
        }

        .continue-btn:hover::before {
            left: 100%;
        }

        .continue-btn::after {
            content: '→';
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%) translateX(0);
            transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            font-size: 24px;
        }

        .continue-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 60px rgba(6, 182, 212, 0.6);
        }

        .continue-btn:hover::after {
            transform: translateY(-50%) translateX(8px);
        }

        .continue-btn:active {
            transform: translateY(-2px);
        }

        /* Typing Animation */
        .typing-indicator {
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 6px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .name-input:focus ~ .typing-indicator {
            opacity: 1;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: linear-gradient(135deg, #06b6d4, #22d3ee);
            animation: typingBounce 1.4s ease-in-out infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Sparkles */
        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            animation: sparkleAnim 1s ease-out forwards;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        @keyframes sparkleAnim {
            0% {
                transform: translate(0, 0) scale(0);
                opacity: 1;
            }
            100% {
                transform: translate(var(--x), var(--y)) scale(1);
                opacity: 0;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .welcome-text {
                font-size: 64px;
            }

            .name-input {
                font-size: 18px;
                padding: 20px 30px;
            }

            .continue-btn {
                padding: 20px 60px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Custom Cursor -->
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <!-- Background -->
    <div class="bg-container">
        <div class="bg-gradient"></div>
        <div class="particles" id="particles"></div>
    </div>

    <!-- Floating Orbs -->
    <div class="floating-orb orb-1"></div>
    <div class="floating-orb orb-2"></div>
    <div class="floating-orb orb-3"></div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="welcome-text">
            <div class="word-welcome">
                <span>W</span><span>E</span><span>L</span><span>C</span><span>O</span><span>M</span><span>E</span>
            </div>
            <div class="word-to">
                <span>TO</span>
            </div>
            <div class="word-trio">
                <span>T</span><span>R</span><span>I</span><span>O</span>
            </div>
        </div>

        <div class="input-container">
            <div class="input-label">Please enter your name</div>
            <div class="input-wrapper">
                <div class="input-glow"></div>
                <input
                    type="text"
                    class="name-input"
                    placeholder=""
                    id="nameInput"
                    autocomplete="off"
                />
                <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            </div>
        </div>

        <button class="continue-btn" id="continueBtn">Let's Begin</button>
    </div>

    <script src="script.js"></script>
    <script>
        // Custom Cursor
        const cursor = document.querySelector('.cursor');
        const follower = document.querySelector('.cursor-follower');

        let mouseX = 0, mouseY = 0;
        let cursorX = 0, cursorY = 0;
        let followerX = 0, followerY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animateCursor() {
            cursorX += (mouseX - cursorX) * 0.3;
            cursorY += (mouseY - cursorY) * 0.3;

            followerX += (mouseX - followerX) * 0.1;
            followerY += (mouseY - followerY) * 0.1;

            cursor.style.transform = `translate(${cursorX}px, ${cursorY}px)`;
            follower.style.transform = `translate(${followerX}px, ${followerY}px)`;

            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // Cursor effects on interactive elements
        const hoverElements = document.querySelectorAll('.name-input, .continue-btn');
        hoverElements.forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursor.style.transform = `translate(${cursorX}px, ${cursorY}px) scale(1.5)`;
                follower.style.transform = `translate(${followerX}px, ${followerY}px) scale(1.5)`;
            });
            el.addEventListener('mouseleave', () => {
                cursor.style.transform = `translate(${cursorX}px, ${cursorY}px) scale(1)`;
                follower.style.transform = `translate(${followerX}px, ${followerY}px) scale(1)`;
            });
        });

        // Particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 60; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.animationDelay = `${Math.random() * 20}s`;
            particle.style.animationDuration = `${15 + Math.random() * 15}s`;
            particlesContainer.appendChild(particle);
        }

        // Floating Orbs Follow Mouse
        const orbs = document.querySelectorAll('.floating-orb');
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;

            orbs.forEach((orb, index) => {
                const speed = (index + 1) * 40;
                const offsetX = (x - 0.5) * speed;
                const offsetY = (y - 0.5) * speed;

                orb.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
            });
        });

        // Input handling
        const nameInput = document.getElementById('nameInput');
        const continueBtn = document.getElementById('continueBtn');

        nameInput.addEventListener('input', (e) => {
            if (e.target.value.trim().length > 0) {
                continueBtn.classList.add('active');
            } else {
                continueBtn.classList.remove('active');
            }
        });

        // Sparkle effect on input focus
        nameInput.addEventListener('focus', () => {
            createSparkles(nameInput);
        });

        function createSparkles(element) {
            const rect = element.getBoundingClientRect();
            for (let i = 0; i < 12; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';

                const angle = (i / 12) * Math.PI * 2;
                const distance = 50;
                const x = Math.cos(angle) * distance;
                const y = Math.sin(angle) * distance;

                sparkle.style.setProperty('--x', `${x}px`);
                sparkle.style.setProperty('--y', `${y}px`);
                sparkle.style.left = `${rect.left + rect.width / 2}px`;
                sparkle.style.top = `${rect.top + rect.height / 2}px`;

                document.body.appendChild(sparkle);

                setTimeout(() => sparkle.remove(), 1000);
            }
        }

        // Continue button action
        continueBtn.addEventListener('click', () => {
            const name = nameInput.value.trim();
            if (name) {
                // Store name in localStorage
                localStorage.setItem('userName', name);

                // Navigate to main app (index.html)
                window.location.href = 'index.html';
            }
        });

        // Enter key to continue
        nameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && nameInput.value.trim().length > 0) {
                continueBtn.click();
            }
        });

        // Auto-focus input after animations
        setTimeout(() => {
            nameInput.focus();
        }, 1500);
    </script>
</body>
</html>
