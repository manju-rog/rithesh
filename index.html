<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRIO - Time Tracking</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Custom Cursor -->
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <!-- Particle Canvas -->
    <canvas id="particleCanvas"></canvas>

    <!-- Gradient Mesh Background -->
    <div class="gradient-mesh"></div>

    <div class="container">
        <!-- Welcome Screen -->
        <div id="welcomeScreen" class="screen active">
            <div class="welcome-text">
                <span class="word" data-word="WELCOME">WELCOME</span>
                <span class="word" data-word="TO">TO</span>
                <span class="word" data-word="TRIO">TRIO</span>
            </div>
            <p class="enter-name-text">please enter your name</p>
            <input type="text" id="nameInput" class="invisible-input" placeholder="" autocomplete="off" maxlength="30">
            <div class="input-indicator"></div>
        </div>

        <!-- Activity Selection Screen -->
        <div id="activityScreen" class="screen">
            <!-- Premium Digital Clock -->
            <div class="digital-clock">
                <div class="clock-container">
                    <div class="clock-display">
                        <span class="clock-digit" id="clock-hours">00</span>
                        <span class="clock-separator">:</span>
                        <span class="clock-digit" id="clock-minutes">00</span>
                        <span class="clock-separator">:</span>
                        <span class="clock-digit" id="clock-seconds">00</span>
                    </div>
                    <div class="clock-date" id="clock-date">Loading...</div>
                    <div class="clock-glow"></div>
                </div>
            </div>

            <h1 class="greeting"></h1>
            <p class="subtext">What would you like to do today?</p>

            <!-- Animated Grid Background -->
            <div class="grid-background"></div>

            <!-- Morphing Blobs -->
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>

            <div class="options-container">
                <div class="options-grid">
                    <div class="option-card" data-activity="University/Advisory">
                        <div class="card-shine"></div>
                        <div class="card-glow-effect"></div>
                        <div class="option-icon">01</div>
                        <div class="option-label">University/Advisory</div>
                        <div class="card-particles"></div>
                    </div>
                    <div class="option-card" data-activity="Tutoring">
                        <div class="card-shine"></div>
                        <div class="card-glow-effect"></div>
                        <div class="option-icon">02</div>
                        <div class="option-label">Tutoring</div>
                        <div class="card-particles"></div>
                    </div>
                    <div class="option-card" data-activity="Study">
                        <div class="card-shine"></div>
                        <div class="card-glow-effect"></div>
                        <div class="option-icon">03</div>
                        <div class="option-label">Study</div>
                        <div class="card-particles"></div>
                    </div>
                    <div class="option-card" data-activity="FAFSA Resources/Assistance">
                        <div class="card-shine"></div>
                        <div class="card-glow-effect"></div>
                        <div class="option-icon">04</div>
                        <div class="option-label">FAFSA Resources/Assistance</div>
                        <div class="card-particles"></div>
                    </div>
                    <div class="option-card" data-activity="Workshop">
                        <div class="card-shine"></div>
                        <div class="card-glow-effect"></div>
                        <div class="option-icon">05</div>
                        <div class="option-label">Workshop</div>
                        <div class="card-particles"></div>
                    </div>
                    <div class="option-card" data-activity="Event">
                        <div class="card-shine"></div>
                        <div class="card-glow-effect"></div>
                        <div class="option-icon">06</div>
                        <div class="option-label">Event</div>
                        <div class="card-particles"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Timer Screen -->
        <div id="timerScreen" class="screen">
            <div class="timer-container">
                <div class="activity-name"></div>
                <div class="timer-display">
                    <span class="time-value" id="hours">00</span>
                    <span class="time-separator">:</span>
                    <span class="time-value" id="minutes">00</span>
                    <span class="time-separator">:</span>
                    <span class="time-value" id="seconds">00</span>
                </div>
                <div class="timer-label">Time Elapsed</div>
                <button id="checkoutBtn" class="checkout-btn">
                    <span>Check Out</span>
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
